<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/>

  <!-- Decorative Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Shield Icon -->
  <g transform="translate(100, 85)">
    <!-- Glowing Shield Outer -->
    <path d="M 75,10 L 140,40 C 140,140 75,200 75,200 C 75,200 10,140 10,40 Z" fill="url(#shieldGrad)" filter="url(#glow)" opacity="0.6"/>
    <!-- Shield Core -->
    <path d="M 75,15 L 132,42 C 132,135 75,190 75,190 C 75,190 18,135 18,42 Z" fill="#0f172a" stroke="url(#accentCyan)" stroke-width="3"/>
    <!-- Lightning Bolt inside shield -->
    <path d="M 82,45 L 50,105 L 75,105 L 68,160 L 105,95 L 80,95 Z" fill="url(#boltGrad)" filter="url(#glow)"/>
  </g>

  <!-- Title & Headline -->
  <g transform="translate(290, 140)">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="900" fill="#f8fafc" letter-spacing="-1.5">
      AEGIS<tspan fill="url(#accentCyan)">BREAKER</tspan>
    </text>
    <text y="42" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#94a3b8" letter-spacing="-0.2">
      High-Throughput, Zero-Dependency Resilience &amp; Circuit Breaker SDK
    </text>
  </g>

  <!-- Key Metrics Pills -->
  <g transform="translate(290, 240)">
    <!-- Pill 1: Zero Deps -->
    <rect x="0" y="0" width="170" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="20" cy="21" r="6" fill="#10b981"/>
    <text x="36" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Zero Dependencies</text>

    <!-- Pill 2: Throughput -->
    <rect x="185" y="0" width="165" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="205" cy="21" r="6" fill="#38bdf8"/>
    <text x="221" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">2.78M+ ops/sec</text>

    <!-- Pill 3: Sliding Window -->
    <rect x="365" y="0" width="180" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="385" cy="21" r="6" fill="#f59e0b"/>
    <text x="401" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">O(1) Sliding Window</text>

    <!-- Pill 4: TypeScript -->
    <rect x="560" y="0" width="150" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="580" cy="21" r="6" fill="#6366f1"/>
    <text x="596" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">TypeScript 5.7+</text>

    <!-- Pill 5: Prometheus -->
    <rect x="725" y="0" width="130" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="745" cy="21" r="6" fill="#ec4899"/>
    <text x="761" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Prometheus</text>
  </g>

  <!-- Bottom State Machine Indicator Bar -->
  <g transform="translate(100, 335)">
    <rect x="0" y="0" width="1000" height="48" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    
    <!-- State Badges -->
    <g transform="translate(40, 14)">
      <rect x="0" y="0" width="110" height="22" rx="4" fill="#065f46"/>
      <text x="18" y="15" font-family="monospace" font-size="12" font-weight="700" fill="#6ee7b7">CLOSED 🟢</text>
    </g>
    
    <text x="175" y="29" font-family="monospace" font-size="14" fill="#64748b">────── (Failures / Slow Calls) ─────►</text>
    
    <g transform="translate(480, 14)">
      <rect x="0" y="0" width="100" height="22" rx="4" fill="#991b1b"/>
      <text x="16" y="15" font-family="monospace" font-size="12" font-weight="700" fill="#fca5a5">OPEN 🔴</text>
    </g>
    
    <text x="605" y="29" font-family="monospace" font-size="14" fill="#64748b">────── (Jittered Backoff) ─────►</text>
    
    <g transform="translate(840, 14)">
      <rect x="0" y="0" width="125" height="22" rx="4" fill="#854d0e"/>
      <text x="14" y="15" font-family="monospace" font-size="12" font-weight="700" fill="#fde047">HALF_OPEN 🟡</text>
    </g>
  </g>
</svg>
