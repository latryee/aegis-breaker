<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Terminal Window with Drop Shadow -->
  <rect x="20" y="20" width="860" height="440" rx="12" fill="url(#termGrad)" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)"/>

  <!-- Window Header / Titlebar -->
  <path d="M 20,20 L 880,20 Q 880,20 880,32 L 880,60 L 20,60 Z" fill="#0f172a" rx="12"/>
  <circle cx="48" cy="40" r="6" fill="#ef4444"/>
  <circle cx="68" cy="40" r="6" fill="#f59e0b"/>
  <circle cx="88" cy="40" r="6" fill="#10b981"/>
  <text x="450" y="44" font-family="system-ui, monospace" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">
    bash — npm run demo (AegisBreaker Simulation)
  </text>

  <!-- Terminal Content -->
  <g transform="translate(48, 85)" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13">
    <!-- Command -->
    <text y="0" fill="#38bdf8" font-weight="700">❯ <tspan fill="#f1f5f9">npm run demo</tspan></text>

    <!-- Banner -->
    <text y="24" fill="#06b6d4" font-weight="700">╔═══════════════════════════════════════════════════════════════════╗</text>
    <text y="42" fill="#06b6d4" font-weight="700">║             🛡️ AEGISBREAKER RESILIENCE ENGINE DEMO 🛡️             ║</text>
    <text y="60" fill="#06b6d4" font-weight="700">║   Mathematical Sliding-Window &amp; Adaptive Circuit Breaking Demo   ║</text>
    <text y="78" fill="#06b6d4" font-weight="700">╚═══════════════════════════════════════════════════════════════════╝</text>

    <!-- Phase 1 -->
    <text y="110" fill="#22c55e" font-weight="700">▶ PHASE 1: Healthy Steady State (0% error rate, low latency)</text>
    <text y="128" fill="#94a3b8">  [Call #1] <tspan fill="#22c55e" font-weight="700">✔ SUCCESS</tspan> | State: <tspan fill="#10b981" font-weight="700">CLOSED 🟢</tspan></text>
    <text y="146" fill="#94a3b8">  [Call #2] <tspan fill="#22c55e" font-weight="700">✔ SUCCESS</tspan> | State: <tspan fill="#10b981" font-weight="700">CLOSED 🟢</tspan></text>

    <!-- Phase 2 -->
    <text y="174" fill="#eab308" font-weight="700">▶ PHASE 2: Upstream Outage Injected (100% error rate)</text>
    <text y="192" fill="#94a3b8">  [Call #6] <tspan fill="#f59e0b">⛑ FALLBACK ACTIVATED</tspan>: Stored in offline cache</text>
    <text y="210" fill="#f43f5e" font-weight="700">  ➔ [STATE CHANGE] CLOSED 🟢 ➔ OPEN 🔴 (Reason: FAILURE_RATE_EXCEEDED)</text>

    <!-- Phase 3 -->
    <text y="238" fill="#f43f5e" font-weight="700">▶ PHASE 3: Circuit is OPEN (Shedding load in 0ms)</text>
    <text y="256" fill="#ef4444">  ⛔ [FAST FAIL] Rejected in 0ms to protect system. Retry in 2100ms</text>

    <!-- Phase 4 & 5 -->
    <text y="284" fill="#38bdf8" font-weight="700">▶ PHASE 5: Probing Upstream Service Recovery in HALF_OPEN</text>
    <text y="302" fill="#22c55e" font-weight="700">  ➔ [STATE CHANGE] OPEN 🔴 ➔ HALF-OPEN 🟡 (Reason: WAIT_DURATION_EXPIRED)</text>
    <text y="320" fill="#94a3b8">  [Probe #13] <tspan fill="#22c55e">✔ PROBE SUCCESS</tspan> | State: <tspan fill="#eab308">HALF-OPEN 🟡</tspan></text>
    <text y="338" fill="#10b981" font-weight="700">  ➔ [STATE CHANGE] HALF-OPEN 🟡 ➔ CLOSED 🟢 (Reason: HALF_OPEN_PROBE_SUCCEEDED)</text>
  </g>
</svg>
